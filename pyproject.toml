[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdcl"
version = "0.1.0"
description = "RDCL: Rationale-based Dual-objective Cooperative Learning for compound-protein interaction prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Zheyu Wu"}
]
keywords = ["drug-discovery", "compound-protein-interaction", "graph-neural-network", "binding-affinity", "binding-site"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "scipy>=1.10",
]

[project.optional-dependencies]
preprocess = [
  "rdkit>=2023.9",
  "biopython>=1.80",
  "fair-esm>=2.0.0",
]
cache = [
  "rdkit>=2023.9",
  "biopython>=1.80",
  "fair-esm>=2.0.0",
  "plip>=3.0.0",
]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "build>=1.0",
]
all = [
  "rdkit>=2023.9",
  "biopython>=1.80",
  "fair-esm>=2.0.0",
  "plip>=3.0.0",
  "pytest>=7",
  "ruff>=0.4",
  "build>=1.0",
]

[tool.setuptools.packages.find]
include = ["rdcl*"]

[tool.ruff]
line-length = 100
